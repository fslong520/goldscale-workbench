[package]
name = "goldscale"
version = "1.0.0"
edition = "2021"
description = "金秤 · 贵金属交易工作台"
authors = ["goldscale"]
# 两个 bin 显式声明：金秤主服务 + agent 常驻宿主 agentd；关自动发现，免生别名与重复目标
autobins = false

[[bin]]
name = "goldscale"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true